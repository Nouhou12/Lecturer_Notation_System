<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lecturer Notation PWA</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0b3d91" />
</head>
<body>
    <main class="app-main">
        <section class="form-card">
            <h2>Add a Note</h2>
            <form id="note-form" class="form_container">
                <label>
                    Course
                    <select id="course" required>
                        <option value="" disabled selected>Select a course</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Biology">Biology</option>
                        <option value="History">History</option>
                    </select>
                </label>

                <label>
                    Student
                    <input id="student" type="text" placeholder="Student name" required />
                </label>

                <label class="rating-label">
                    Note rating
                    <div class="rating-group" id="rating-group">
                        <input type="radio" name="rating" id="rating-1" value="1" required />
                        <label for="rating-1" title="1 star">★</label>

                        <input type="radio" name="rating" id="rating-2" value="2" />
                        <label for="rating-2" title="2 stars">★</label>

                        <input type="radio" name="rating" id="rating-3" value="3" />
                        <label for="rating-3" title="3 stars">★</label>

                        <input type="radio" name="rating" id="rating-4" value="4" />
                        <label for="rating-4" title="4 stars">★</label>

                        <input type="radio" name="rating" id="rating-5" value="5" />
                        <label for="rating-5" title="5 stars">★</label>
                    </div>
                </label>

                <label>
                    Note
                    <textarea id="note" placeholder="Note details" rows="4"></textarea>
                </label>
                <button type="submit">Submit the note</button>
            </form>
        </section>

        <section class="notes-card">
            <h2>Recent Notes</h2>
            <div id="notes-list"></div>
        </section>

    </main>

    <footer class="site-footer">
        <p>&copy; Rousseau University Institute - Learn, Create and Innovate</p>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
