<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/RUI.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400..900&display=swap" rel="stylesheet">
</head>

<body>
    <h1 class="title">Login</h1>
    <form id="loginForm" class="login">
        <div class="login-form">
            <p>Email</p>
            <input id="loginEmail" type="email" name="email" placeholder="Enter your email" class="email" required>
        </div>
        <div class="login-form">
            <p>Password</p>
            <input id="loginPassword" type="password" name="password" placeholder="Enter your password" class="password"
                required>
        </div>
        <button type="submit">Login</button>
        <p id="loginMessage" class="auth-message"></p>
    </form>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
        import { doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';

        const ADMIN_EMAIL = 'admin@rui.com';

        function isAdminEmail(email = '') {
            return (email || '').toLowerCase() === ADMIN_EMAIL;
        }

        async function syncUserProfile(user) {
            if (!user) return;

            const userRef = doc(db, 'users', user.uid);
            const userDoc = await getDoc(userRef);
            const email = (user.email || '').toLowerCase();
            const role = isAdminEmail(email) ? 'admin' : 'student';

            if (!userDoc.exists()) {
                await setDoc(userRef, {
                    uid: user.uid,
                    email: user.email || '',
                    displayName: user.displayName || (user.email || '').split('@')[0],
                    role,
                    createdAt: new Date(),
                });
            } else {
                await setDoc(userRef, {
                    ...userDoc.data(),
                    uid: user.uid,
                    email: user.email || '',
                    displayName: user.displayName || userDoc.data()?.displayName || (user.email || '').split('@')[0],
                    role: userDoc.data()?.role ?? role,
                    updatedAt: new Date(),
                }, { merge: true });
            }

            // Store class in localStorage
            const updatedDoc = await getDoc(userRef);
            if (updatedDoc.exists()) {
                const userClass = updatedDoc.data().class;
                if (userClass) {
                    localStorage.setItem("userClass", userClass);
                }
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            const loginForm = document.getElementById("loginForm");
            const loginMessage = document.getElementById("loginMessage");

            function showMessage(el, msg, type) {
                el.textContent = msg;
                el.className = "auth-message " + (type || "");
            }

            loginForm.addEventListener("submit", function (event) {
                event.preventDefault();
                const email = document.getElementById("loginEmail").value.trim().toLowerCase();
                const password = document.getElementById("loginPassword").value;

                signInWithEmailAndPassword(auth, email, password)
                    .then(async (userCredential) => {
                        await syncUserProfile(userCredential.user);
                        localStorage.setItem("currentUser", userCredential.user.email || "");
                        showMessage(loginMessage, "Login successful. Redirecting...", "success");
                        const userEmail = (userCredential.user.email || "").toLowerCase();
                        const isAdmin = isAdminEmail(userEmail);
                        const targetPage = isAdmin ? "admin.html" : "home.html";
                        setTimeout(() => window.location.href = targetPage, 500);
                    })
                    .catch((error) => {
                        showMessage(loginMessage, error.message || 'Login failed', 'error');
                    });
            });
        });
    </script>
</body>

</html>
