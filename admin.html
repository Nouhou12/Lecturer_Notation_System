<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Lecturer Notation</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="app-header">
        <h1>Admin Analytics & Notes</h1>
        <p>Lecturer evaluation averages and student feedback overview.</p>
        <nav class="top-nav">
            <a href="home.html">Home</a>
            <a href="index.html">Add Evaluation</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="app-main">
        <!-- Top Key Performance Indicators -->
        <section class="admin-stats-grid">
            <div class="stat-card">
                <span class="stat-label">Total Submissions</span>
                <span class="stat-value" id="totalSubmissions">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Classes Evaluated</span>
                <span class="stat-value" id="totalLecturers">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">System Average</span>
                <span class="stat-value accent" id="systemAverage">0.0 ★</span>
            </div>
        </section>

        <!-- Lecturer Aggregated Ratings Section -->
        <section class="admin-card">
            <h2>Class Performance & Course Evaluations</h2>
            <div id="analyticsContainer" class="analytics-grid">
                <!-- Dynamically populated class scorecards -->
            </div>
        </section>

        <!-- Raw Notes Stream -->
        <section class="admin-card">
            <div class="section-header-inline">
                <h2>All Student Feedback</h2>
                <div class="admin-actions">
                    <button id="refreshBtn" class="btn-secondary">Refresh</button>
                    <button id="clearBtn" class="btn-outline">Clear Local Notes</button>
                </div>
            </div>
            <p id="adminMessage" class="auth-message"></p>
            <div id="notesContainer" class="notes-feed"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; Rousseau University Institute - Learn, Create and Innovate</p>
    </footer>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
        import { collection, doc, getDoc, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';

        const msg = document.getElementById('adminMessage');
        const container = document.getElementById('notesContainer');
        const analyticsContainer = document.getElementById('analyticsContainer');
        const refreshBtn = document.getElementById('refreshBtn');
        const clearBtn = document.getElementById('clearBtn');

        // Stats Elements
        const totalSubmissionsEl = document.getElementById('totalSubmissions');
        const totalLecturersEl = document.getElementById('totalLecturers');
        const systemAverageEl = document.getElementById('systemAverage');

        function showMessage(text, type) {
            msg.textContent = text || '';
            msg.className = 'auth-message ' + (type || '');
        }

        async function currentUserIsAdmin(user) {
            if (!user || !user.email) return false;
            const email = (user.email || '').toLowerCase();
            if (email === 'admin@rui.com') return true;

            try {
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                return userDoc.exists() && (userDoc.data()?.role === 'admin');
            } catch (error) {
                return false;
            }
        }

        async function loadNotesFromFirestore() {
            const q = query(collection(db, 'lecturerNotes'), orderBy('createdAt', 'desc'));
            const snap = await getDocs(q);
            return snap.docs.map(d => ({ id: d.id, ...d.data() }));
        }

        // Generate Aggregate Analytics by Class
        function computeClassAnalytics(notes) {
            const stats = {};

            notes.forEach(n => {
                const studentClass = n.class || 'Unknown Class';
                const course = n.course || 'General Subject';
                const classKey = studentClass;

                if (!stats[classKey]) {
                    stats[classKey] = {
                        className: studentClass,
                        count: 0,
                        totalOverall: 0,
                        courses: {},
                        claritySum: 0,
                        behaviorSum: 0,
                        punctualitySum: 0,
                        materialSum: 0,
                        hasCriteria: false
                    };
                }

                const classItem = stats[classKey];
                classItem.count++;

                // Initialize course in this class if not exists
                if (!classItem.courses[course]) {
                    classItem.courses[course] = {
                        courseName: course,
                        count: 0,
                        totalRating: 0
                    };
                }

                classItem.courses[course].count++;
                
                // Overall score calculation
                const overall = n.rating || n.overallRating || 0;
                classItem.totalOverall += Number(overall);
                classItem.courses[course].totalRating += Number(overall);

                // Multi-criteria parsing (if submitted via structured form)
                const clarity = n.clarity || (n.ratings && n.ratings.clarity) || 0;
                const behavior = n.behavior || (n.ratings && n.ratings.behavior) || 0;
                const punctuality = n.punctuality || (n.ratings && n.ratings.punctuality) || 0;
                const material = n.material || (n.ratings && n.ratings.material) || 0;

                if (clarity || behavior || punctuality || material) {
                    classItem.hasCriteria = true;
                    classItem.claritySum += Number(clarity);
                    classItem.behaviorSum += Number(behavior);
                    classItem.punctualitySum += Number(punctuality);
                    classItem.materialSum += Number(material);
                }
            });

            return Object.values(stats).map(s => ({
                ...s,
                avgOverall: (s.totalOverall / s.count).toFixed(1),
                avgClarity: s.hasCriteria ? (s.claritySum / s.count).toFixed(1) : null,
                avgBehavior: s.hasCriteria ? (s.behaviorSum / s.count).toFixed(1) : null,
                avgPunctuality: s.hasCriteria ? (s.punctualitySum / s.count).toFixed(1) : null,
                avgMaterial: s.hasCriteria ? (s.materialSum / s.count).toFixed(1) : null,
                courses: Object.values(s.courses).map(c => ({
                    ...c,
                    avgRating: (c.totalRating / c.count).toFixed(1)
                }))
            }));
        }

        function renderDashboard(notes) {
            if (!notes || notes.length === 0) {
                totalSubmissionsEl.textContent = '0';
                totalLecturersEl.textContent = '0';
                systemAverageEl.textContent = '0.0 ★';
                analyticsContainer.innerHTML = '<p class="empty-state">No evaluations collected yet.</p>';
                container.innerHTML = '<p class="empty-state">No notes found.</p>';
                return;
            }

            const classStats = computeClassAnalytics(notes);

            // 1. Render Top KPI Metrics
            totalSubmissionsEl.textContent = notes.length;
            totalLecturersEl.textContent = classStats.length;
            const grandTotal = classStats.reduce((acc, curr) => acc + Number(curr.avgOverall), 0);
            systemAverageEl.textContent = `${(grandTotal / classStats.length).toFixed(1)} / 5 ★`;

            // 2. Render Class Scorecards
            analyticsContainer.innerHTML = '';
            classStats.forEach(stat => {
                const card = document.createElement('div');
                card.className = 'lecturer-analytics-card';

                let coursesHTML = '<div class="courses-list">';
                stat.courses.forEach(course => {
                    coursesHTML += `
                        <div class="course-item">
                            <span>${course.courseName}</span>
                            <strong>${course.avgRating} / 5 ★</strong>
                        </div>
                    `;
                });
                coursesHTML += '</div>';

                let criteriaHTML = '';
                if (stat.hasCriteria) {
                    criteriaHTML = `
                        <div class="criteria-breakdown">
                            <div class="criteria-item">
                                <span>Clarity & Pedagogy</span>
                                <strong>${stat.avgClarity} / 5</strong>
                            </div>
                            <div class="criteria-item">
                                <span>Professionalism</span>
                                <strong>${stat.avgBehavior} / 5</strong>
                            </div>
                            <div class="criteria-item">
                                <span>Punctuality</span>
                                <strong>${stat.avgPunctuality} / 5</strong>
                            </div>
                            <div class="criteria-item">
                                <span>Course Material</span>
                                <strong>${stat.avgMaterial} / 5</strong>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="card-header-flex">
                        <div>
                            <h3 class="lecturer-title">${stat.className}</h3>
                        </div>
                        <div class="score-badge">
                            <span class="score-num">${stat.avgOverall}</span>
                            <span class="score-star">★</span>
                        </div>
                    </div>
                    ${coursesHTML}
                    ${criteriaHTML}
                    <div class="card-footer-meta">
                        Based on ${stat.count} student evaluation${stat.count > 1 ? 's' : ''}
                    </div>
                `;
                analyticsContainer.appendChild(card);
            });

            // 3. Render Individual Notes Feed
            container.innerHTML = '';
            notes.forEach((n) => {
                const article = document.createElement('article');
                article.className = 'note-item';
                const created = n.createdAt 
                    ? new Date(n.createdAt.seconds ? n.createdAt.seconds * 1000 : n.createdAt).toLocaleString() 
                    : 'Recent';

                const ratingVal = Math.round(n.rating || n.overallRating || 0);

                article.innerHTML = `
                    <div class="note-item-header">
                        <strong>${n.course || ''} — <span class="text-muted">${n.class || 'Unknown Class'}</span></strong>
                        <div class="note-rating">${'★'.repeat(ratingVal)}${'☆'.repeat(5 - ratingVal)}</div>
                    </div>
                    <div class="note-meta-row">
                        <span class="note-meta-date">${created}</span>
                    </div>
                    <p class="note-body-text">${n.note || n.comments || 'No written comment provided.'}</p>
                `;
                container.appendChild(article);
            });
        }

        async function initForUser(user) {
            const isAdmin = await currentUserIsAdmin(user);
            if (!isAdmin) {
                showMessage('Admin access required. Redirecting to login...', 'error');
                setTimeout(() => window.location.href = 'login.html', 900);
                return;
            }

            try {
                const notes = await loadNotesFromFirestore();
                renderDashboard(notes);
                showMessage('Dashboard updated with live Firestore data.', 'success');
            } catch (err) {
                showMessage('Error loading evaluation stats: ' + (err.message || err), 'error');
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) initForUser(user);
            else {
                showMessage('Not signed in. Redirecting to login...', 'error');
                setTimeout(() => window.location.href = 'login.html', 700);
            }
        });

        refreshBtn.addEventListener('click', async () => {
            try {
                const notes = await loadNotesFromFirestore();
                renderDashboard(notes);
                showMessage('Refreshed data successfully.', 'success');
            } catch (err) {
                showMessage('Failed to refresh: ' + err.message, 'error');
            }
        });

        clearBtn.addEventListener('click', () => {
            if (!confirm('Clearing Firestore documents requires database management privileges. Continue?')) return;
            showMessage('To clear notes from Firestore, use the Firebase Console or enable batch delete security rules.', 'error');
        });
    </script>
</body>
</html>
